# Deploy aplikasi manajemen Hans Batik di Netlify.
# Di Netlify: Site configuration → Build & deploy → Base directory = hans-batik
[build]
  command = "node scripts/build-config.mjs"
  publish = "www"

[build.environment]
  NODE_VERSION = "20"
  # Repo ini juga berisi landing page Next.js di root. Netlify bisa memasang
  # plugin Next.js otomatis; aplikasi ini bukan Next.js, jadi plugin dilewati.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.supabase.in wss://*.supabase.in; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/config.js"
  [headers.values]
    Cache-Control = "no-cache"
